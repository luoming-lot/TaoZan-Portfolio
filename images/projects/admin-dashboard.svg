  <rect x="340" y="60" width="800" height="555" rx="16" fill="#0f1117" stroke="#1e293b" stroke-width="1"/>
  <!-- Stat cards -->
  <rect x="370" y="90" width="170" height="80" rx="10" fill="#1a1d2e" stroke="#1e293b" stroke-width="1"/>
  <text x="385" y="115" font-family="system-ui" font-size="11" fill="#64748b">Total Revenue</text>
  <text x="385" y="145" font-family="system-ui" font-size="24" font-weight="700" fill="#f1f5f9">$45,230</text>
  <rect x="560" y="90" width="170" height="80" rx="10" fill="#1a1d2e" stroke="#1e293b" stroke-width="1"/>
  <text x="575" y="115" font-family="system-ui" font-size="11" fill="#64748b">Active Users</text>
  <text x="575" y="145" font-family="system-ui" font-size="24" font-weight="700" fill="#f1f5f9">2,847</text>
  <rect x="750" y="90" width="170" height="80" rx="10" fill="#1a1d2e" stroke="#1e293b" stroke-width="1"/>
  <text x="765" y="115" font-family="system-ui" font-size="11" fill="#64748b">Orders</text>
  <text x="765" y="145" font-family="system-ui" font-size="24" font-weight="700" fill="#f1f5f9">1,203</text>
  <rect x="940" y="90" width="170" height="80" rx="10" fill="#1a1d2e" stroke="#1e293b" stroke-width="1"/>
  <text x="955" y="115" font-family="system-ui" font-size="11" fill="#64748b">Growth</text>
  <text x="955" y="145" font-family="system-ui" font-size="24" font-weight="700" fill="#22c55e">+12.5%</text>
  <!-- Chart area -->
  <rect x="370" y="195" width="740" height="200" rx="10" fill="#1a1d2e" stroke="#1e293b" stroke-width="1"/>
  <polyline points="390,350 490,310 590,330 690,280 790,300 890,250 990,270 1090,240" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <!-- Table -->
  <rect x="370" y="420" width="740" height="165" rx="10" fill="#1a1d2e" stroke="#1e293b" stroke-width="1"/>
  <rect x="390" y="440" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="580" y="440" width="100" height="8" rx="4" fill="#1e293b"/>
  <rect x="690" y="440" width="60" height="8" rx="4" fill="#1e293b"/>
