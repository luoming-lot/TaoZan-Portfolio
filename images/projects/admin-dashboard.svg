  <rect x="580" y="465" width="120" height="8" rx="4" fill="#1e293b"/>
  <rect x="690" y="465" width="80" height="8" rx="4" fill="#1e293b"/>
  <rect x="390" y="490" width="200" height="8" rx="4" fill="#1e293b"/>
  <rect x="390" y="515" width="140" height="8" rx="4" fill="#1e293b"/>
