<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.04">
    <line x1="0" y1="135" x2="1200" y2="135" stroke="white"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="white"/>
    <line x1="0" y1="405" x2="1200" y2="405" stroke="white"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="white"/>
    <line x1="300" y1="0" x2="300" y2="675" stroke="white"/>
    <line x1="600" y1="0" x2="600" y2="675" stroke="white"/>
    <line x1="900" y1="0" x2="900" y2="675" stroke="white"/>
  </g>
  <!-- Sidebar mock -->
  <rect x="60" y="60" width="240" height="555" rx="16" fill="#0f1117" stroke="#1e293b" stroke-width="1"/>
  <rect x="90" y="90" width="180" height="12" rx="6" fill="#8b5cf6" opacity="0.6"/>
  <rect x="90" y="120" width="140" height="10" rx="5" fill="#1e293b"/>
